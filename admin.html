<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin — TaskEarn BD</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">▶ TaskEarn <b>BD</b> — Super Admin</div><nav><button onclick="location.href='/dashboard.html'">User View</button><button onclick="logout()">Logout</button></nav></header>
<main><section><h2>Owner Control Center</h2><div id="stats" class="plans"></div>
<h2>Create Task</h2><div class="plan" style="max-width:700px;margin:auto"><input id="title" placeholder="Task title"><input id="desc" placeholder="Description"><input id="reward" placeholder="Reward"><input id="url" placeholder="Task URL"><button onclick="addTask()">Publish Task</button></div>
<h2>Withdrawal Requests</h2><div id="withdrawals" class="plan" style="overflow:auto"></div>
<h2>Users</h2><div id="users" class="plan" style="overflow:auto"></div></section></main>
<script>
const $=s=>document.querySelector(s);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function load(){try{let s=await api('/api/admin/stats');$('#stats').innerHTML=`<div class="plan"><b>Users</b><strong>${s.users}</strong></div><div class="plan"><b>Active Tasks</b><strong>${s.activeTasks}</strong></div><div class="plan"><b>Pending</b><strong>${s.pendingWithdrawals}</strong></div><div class="plan"><b>Total User Balance</b><strong>৳${s.balance.toFixed(2)}</strong></div>`;let w=await api('/api/admin/withdrawals');$('#withdrawals').innerHTML='<table>'+w.withdrawals.map(x=>`<tr><td>${x.name}</td><td>৳${x.amount}</td><td>${x.method}</td><td>${x.account}</td><td>${x.status}</td><td>${x.status==='Pending'?`<button onclick="status(${x.id},'Approved')">Approve</button> <button onclick="status(${x.id},'Rejected')">Reject</button>`:''}</td></tr>`).join('')+'</table>';let u=await api('/api/admin/users');$('#users').innerHTML='<table><tr><th>Name</th><th>Email</th><th>Tier</th><th>Balance</th><th>Role</th></tr>'+u.users.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.tier}</td><td>৳${x.balance.toFixed(2)}</td><td>${x.is_admin?'SUPER ADMIN':'USER'}</td></tr>`).join('')+'</table>'}catch(e){alert(e.message);location.href='/'}}async function addTask(){try{await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title:$('#title').value,description:$('#desc').value,reward:Number($('#reward').value),url:$('#url').value})});alert('Task published');load()}catch(e){alert(e.message)}}async function status(id,status){try{await api('/api/admin/withdrawals/'+id+'/status',{method:'POST',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}async function logout(){await api('/api/logout',{method:'POST'});location.href='/'}load();
</script></body></html>
